services:
  - type: web
    name: esp32-health-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --bind 0.0.0.0:$PORT health:app
    healthCheckPath: /healthz
    envVars:
      - key: AES_KEY_HEX
        sync: false
      - key: MQTT_BROKER
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC
        value: health/fhir
